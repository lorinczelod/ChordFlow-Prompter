name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Installs this Gradle so the wrapper can be generated when the repo has none.
          gradle-version: '8.9'

      - name: Generate the Gradle wrapper if it is missing
        run: |
          if [ ! -f gradlew ]; then
            echo "No gradlew found — generating the wrapper."
            gradle wrapper --gradle-version 8.9
          else
            echo "gradlew already present."
          fi
          chmod +x gradlew

      - name: Build the debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload the APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChordFlowPrompter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports when the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7
